<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authenticating X-Codes...</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      background: #090d16;
      color: #f8fafc;
    }
    .card {
      background: #151d2f;
      border: 1px solid #1e293b;
      padding: 2.25rem 2rem;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      max-width: 400px;
      width: 100%;
    }
    .spinner {
      width: 44px;
      height: 44px;
      margin: 0 auto 1.5rem;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      margin: 0 0 0.5rem;
      font-size: 1.35rem;
      font-weight: 600;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0 0 1.5rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 0.875rem 1.5rem;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      transition: background 0.15s ease;
    }
    .btn:active {
      background: #1d4ed8;
    }
    .footer {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Opening X-Codes...</h2>
    <p>Authentication complete. Returning you to the IDE workspace.</p>
    <a id="action-btn" class="btn" href="#">Open X-Codes IDE</a>
    <div class="footer">If the app doesn't open automatically, tap the button above.</div>
  </div>

  <script>
    (function() {
      const search = window.location.search || '';
      const customSchemeUri = 'vmstudio://auth/google' + search;
      const androidIntentUri = 'intent://auth/google' + search + '#Intent;scheme=vmstudio;package=digital.vmstudio.code;end';

      const btn = document.getElementById('action-btn');
      
      // On Android browsers, intent:// format reliably opens the registered app
      const isAndroid = /Android/i.test(navigator.userAgent);
      const targetUri = isAndroid ? androidIntentUri : customSchemeUri;
      btn.href = targetUri;

      btn.addEventListener('click', function(e) {
        // Fallback to custom scheme if intent doesn't trigger
        setTimeout(function() {
          window.location.href = customSchemeUri;
        }, 600);
      });

      // Attempt automatic redirect
      try {
        window.location.href = targetUri;
      } catch (err) {
        console.warn('Auto redirect failed', err);
      }
    })();
  </script>
</body>
</html>
