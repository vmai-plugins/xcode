name: Nightly APK

# Publishes the latest main build as a downloadable APK on the Releases page, so
# it can be installed straight from a phone browser. CI artifacts are zipped and
# hidden in GitHub's mobile view; a release asset is one tap.
#
# Reuses the APK the Build workflow already produced for the same commit instead
# of compiling the app a second time. A manual run (workflow_dispatch) has no
# build to reuse, so it compiles.
#
# Marked as a pre-release under the moving `nightly` tag: the in-app updater only
# reads full releases, so this never shows up as an update prompt.

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  publish:
    name: Publish nightly APK
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download the APK Build already made
        if: github.event_name == 'workflow_run'
        id: download_apk
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: app-debug
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: apk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Assemble debug if not already downloaded
        run: |
          mkdir -p apk
          if [ ! -f apk/app-debug.apk ]; then
            echo "Building APK directly in nightly pipeline..."
            ./gradlew assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk apk/app-debug.apk
          fi

      - name: Name the APK
        run: |
          SHA="$(git rev-parse HEAD)"
          SHORT_SHA="${SHA::7}"
          cp apk/app-debug.apk "xcodes-nightly-${SHORT_SHA}.apk"
          # A fixed name too, so a server can always fetch the latest by one URL.
          cp apk/app-debug.apk "xcodes-nightly.apk"
          echo "APK_FILE=xcodes-nightly-${SHORT_SHA}.apk" >> "$GITHUB_ENV"
          echo "SHA=${SHA}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Move nightly tag
        run: |
          git tag -f nightly "$SHA"
          git push -f origin nightly

      - name: Replace nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes 2>/dev/null || true
          gh release create nightly "$APK_FILE" xcodes-nightly.apk \
            --prerelease \
            --title "Nightly (${SHORT_SHA})" \
            --notes "Debug build of main at ${SHA}. Installs next to a release build. On your phone: tap the .apk below, then allow installs from your browser if asked. Stable link to the latest: https://github.com/${GITHUB_REPOSITORY}/releases/download/nightly/xcodes-nightly.apk"

      - name: Deploy APK to apps.vmstudio.digital
        if: env.DEPLOY_SSH_KEY != ''
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || 'root@200.234.41.231' }}
          TARGET_DIR: /home/vmstudio-apps/htdocs/apps.vmstudio.digital/x-codes
        run: |
          mkdir -p ~/.ssh && echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_HOST" "mkdir -p $TARGET_DIR"
          scp -i ~/.ssh/id_rsa xcodes-nightly.apk "${DEPLOY_HOST}:${TARGET_DIR}/.xcodes-latest.uploading.apk"
          ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_HOST" "cd $TARGET_DIR && mv -f .xcodes-latest.uploading.apk xcodes-latest.apk && chmod 644 xcodes-latest.apk"
          echo "Successfully published xcodes-latest.apk to https://apps.vmstudio.digital/x-codes/xcodes-latest.apk"
