name: Nightly APK

# Publishes the latest main build as a downloadable APK on the Releases page, so
# it can be installed straight from a phone browser. CI artifacts are zipped and
# hidden in GitHub's mobile view; a release asset is one tap.
#
# Marked as a pre-release under the moving `nightly` tag: the in-app updater only
# reads full releases, so this never shows up as an update prompt.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  publish:
    name: Build and publish nightly APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Name the APK
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          cp app/build/outputs/apk/debug/app-debug.apk "xcodes-nightly-${SHORT_SHA}.apk"
          echo "APK_FILE=xcodes-nightly-${SHORT_SHA}.apk" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      # Move the tag to this commit; the release below then points at it.
      - name: Move nightly tag
        run: |
          git tag -f nightly
          git push -f origin nightly

      - name: Replace nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes 2>/dev/null || true
          gh release create nightly "$APK_FILE" \
            --prerelease \
            --title "Nightly (${SHORT_SHA})" \
            --notes "Debug build of main at ${GITHUB_SHA}. Installs next to a release build. On your phone: tap the .apk below, then allow installs from your browser if asked."
