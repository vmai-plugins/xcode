name: VPS Maintenance & Safe Cleanup

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform on VPS 2 (200.234.41.231)'
        required: true
        default: 'inspect-disk-usage'
        type: choice
        options:
          - 'inspect-disk-usage'
          - 'safe-clean-android-caches'
          - 'refresh-apps-hub'

permissions:
  contents: read

jobs:
  maintenance:
    name: VPS Maintenance
    runs-on: ubuntu-latest
    steps:
      - name: Check SSH Key Secret
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::DEPLOY_SSH_KEY is not configured in repository secrets."
            echo "Add your VPS SSH private key under GitHub Settings -> Secrets and variables -> Actions -> DEPLOY_SSH_KEY"
            exit 1
          fi

      - name: Execute Maintenance Action via SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || 'root@200.234.41.231' }}
          ACTION: ${{ github.event.inputs.action }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "==> Running action '$ACTION' on $DEPLOY_HOST..."

          if [ "$ACTION" = "inspect-disk-usage" ]; then
            ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa "$DEPLOY_HOST" \
              "df -h /; echo ''; du -sh /home/vmstudio-apps/htdocs/* 2>/dev/null || true; du -sh /root/.gradle /opt/android-sdk 2>/dev/null || true"

          elif [ "$ACTION" = "safe-clean-android-caches" ]; then
            ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa "$DEPLOY_HOST" \
              "rm -rf /root/.gradle/caches /root/.gradle/daemon ~/.gradle/caches 2>/dev/null || true; apt-get clean 2>/dev/null || true; df -h /"

          elif [ "$ACTION" = "refresh-apps-hub" ]; then
            ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_rsa "$DEPLOY_HOST" \
              "ls -lh /home/vmstudio-apps/htdocs/apps.vmstudio.digital/x-codes/ || true"
          fi
