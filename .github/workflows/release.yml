name: Release

# Publishes a full, signed release when a version tag is pushed (v0.5.0, ...).
#
# The in-app updater only reads full releases, so this is what makes "update
# available" work; the nightly stays a pre-release for testing. The tag must match
# VERSION_NAME in build-logic's BuildConfig, so the version the app reports and
# the one the updater compares against can never drift.
#
# Needs four repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    the release keystore, base64-encoded (base64 -w0 release.jks)
#   KEYSTORE_PASSWORD  its store password
#   KEY_ALIAS          the key alias
#   KEY_PASSWORD       the key password
# Without them the run stops with an error instead of publishing an unsigned APK.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false

jobs:
  release:
    name: Build and publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          VERSION="$(sed -n 's/.*VERSION_NAME = "\(.*\)".*/\1/p' build-logic/convention/src/main/kotlin/digital/vmstudio/buildlogic/BuildConfig.kt)"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION_NAME ${VERSION}"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set; a release must be signed. See the header of release.yml."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "VMSTUDIO_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Assemble signed release
        run: ./gradlew :app:assembleRelease --stacktrace
        env:
          VMSTUDIO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VMSTUDIO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VMSTUDIO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify the APK is signed
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -n1)"
          if [ -z "$APK" ]; then
            echo "::error::No signed release APK was produced; check the signing secrets."
            exit 1
          fi
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          cp "$APK" "xcodes-${VERSION}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "xcodes-${VERSION}.apk" \
            --title "X-Codes ${VERSION}" \
            --generate-notes
