name: Release

# Publishes a full, signed release when a version tag is pushed (v0.5.0, ...).
#
# The in-app updater only reads full releases, so this is what makes "update
# available" work; the nightly stays a pre-release for testing. The tag must match
# VERSION_NAME in build-logic's BuildConfig, so the version the app reports and
# the one the updater compares against can never drift.
#
# Needs four repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64    the release keystore, base64-encoded (base64 -w0 release.jks)
#   KEYSTORE_PASSWORD  its store password
#   KEY_ALIAS          the key alias
#   KEY_PASSWORD       the key password
# Without them the run stops with an error instead of publishing an unsigned APK.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false

jobs:
  release:
    name: Build and publish signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Check the tag matches the app version
        run: |
          VERSION="$(sed -n 's/.*VERSION_NAME = "\(.*\)".*/\1/p' build-logic/convention/src/main/kotlin/digital/vmstudio/buildlogic/BuildConfig.kt)"
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v${VERSION}"
          fi
          if [ "v${VERSION}" != "${TAG_NAME}" ]; then
            echo "::error::Tag ${TAG_NAME} does not match VERSION_NAME ${VERSION}"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${TAG_NAME}" >> "$GITHUB_ENV"

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "VMSTUDIO_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::KEYSTORE_BASE64 secret not set; using debug key signing for release APK."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Assemble release
        run: ./gradlew :app:assembleRelease -x lintVitalRelease --stacktrace
        env:
          VMSTUDIO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VMSTUDIO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VMSTUDIO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify the APK is signed
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -n1)"
          if [ -z "$APK" ]; then
            APK="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          fi
          if [ -z "$APK" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          cp "$APK" "xcodes-${VERSION}.apk"

      - name: Publish release to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_TAG="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          gh release create "$TARGET_TAG" "xcodes-${VERSION}.apk" \
            --title "X-Codes ${VERSION}" \
            --generate-notes || \
          gh release upload "$TARGET_TAG" "xcodes-${VERSION}.apk" --clobber

      - name: Deploy APK to apps.vmstudio.digital
        if: env.DEPLOY_SSH_KEY != '' && success()
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || 'root@200.234.41.231' }}
          TARGET_DIR: /home/vmstudio-apps/htdocs/apps.vmstudio.digital/x-codes
          META_DIR: /home/vmstudio-apps/htdocs/apps.vmstudio.digital/x-codes/build-info
        run: |
          set -e
          mkdir -p ~/.ssh && echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_HOST" "mkdir -p $TARGET_DIR $META_DIR"
          scp -i ~/.ssh/id_rsa "xcodes-${VERSION}.apk" "${DEPLOY_HOST}:${TARGET_DIR}/app-release.apk"
          ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_HOST" \
            "cd $TARGET_DIR && cp -f app-release.apk xcodes-latest.apk && chmod 644 app-release.apk xcodes-latest.apk"

          cat > meta.json <<EOF
          {
            "workflow": "release.yml",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "commit": "${GITHUB_SHA}",
            "short_sha": "${GITHUB_SHA::7}",
            "version_name": "${VERSION}",
            "build_type": "release_signed",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          scp -i ~/.ssh/id_rsa meta.json "${DEPLOY_HOST}:${META_DIR}/release-${VERSION}.json" || true
          ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_HOST" "cd $META_DIR && ln -sf release-${VERSION}.json xcodes-latest.json" || true

          echo "Successfully published xcodes-${VERSION}.apk to https://apps.vmstudio.digital/x-codes/xcodes-latest.apk"
